    - { at: 1000,  island: nagasaki-naru,     kind: firework.reserve, resource: "firework:a" }
    - { at: 24000, island: nagasaki-fukue,    kind: stall.reserve,    resource: "stall:main" }
    - { at: 45000, island: nagasaki-nakadori, kind: firework.reserve, resource: "firework:b" }
