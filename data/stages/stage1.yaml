  - { ref: kagawa-teshima, layout: { x: 430, y: 300 }, color: "#3D85C6" }
  - { ref: kagawa-naoshima, layout: { x: 200, y: 330 }, color: "#81B29A" }

routes:
  - a: kagawa-shodoshima
    b: kagawa-teshima
