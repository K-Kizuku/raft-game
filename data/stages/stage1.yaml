# Stage 1「はじめての郵便船」（瀬戸内）。値は進行表 §3・データ仕様 §5.2 のとおり（調整は T-501）。
format: 1
id: stage1
title: はじめての郵便船
region: 瀬戸内（香川県）
intro:
  text: 温暖で雨の少ない瀬戸内の海。小豆島・豊島・直島を結ぶ郵便船の、はじめての航海です。
  provenance: derived
  source: { dataset: mlit-ritou-2026, region: 小豆島地域, field: NATURAL_CLIMATE_FEATURES, quote: "温暖、小雨の典型的な瀬戸内式気候" }
learning: [log_replication, commit, quorum, prevote]
durationMs: 180000
unlock: null

islands:
