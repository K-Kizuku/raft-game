# Stage 3「嵐の離島共和国」（伊豆諸島）。値は進行表 §1・§5・データ仕様 §4.4・§4.5・§5.5 のとおり（調整は T-718 #300）。
format: 1
id: stage3
title: 嵐の離島共和国
region: 伊豆諸島（東京都）
intro:
  text: 伊豆諸島の 6 つの島。令和 2 年の定期貨客船の欠航率は、利島 17%、御蔵島・青ヶ島 41% です。ヘリコミューターでつながる島々を、6 隻の郵便船で結びます。船の名前は計画書に記載された船名を使用しており、運航会社とは関係ありません。
  provenance: derived
  source: { dataset: mlit-ritou-2026, region: 伊豆諸島地域, field: MARITIME_TRANSPORT, quote: "令和2(2020)年利島17%、御蔵島・青ヶ島41%" }
learning: [network_partition, quorum, leader_election, check_quorum]
durationMs: 240000
unlock: stage2

islands:                        # 島・配置・色・郵便局長は demo-izu と同じ（repo_postmaster_test.go）
  - ref: tokyo-oshima
    layout: { x: 160, y: 90 }
    color: "#E07A5F"
    postmaster: { name: はまかぜ局長, tone: casual, provenance: creative }
  - ref: tokyo-toshima
    layout: { x: 300, y: 70 }
    color: "#3D85C6"
    postmaster: { name: しまかげ局長, tone: polite, provenance: creative }
  - ref: tokyo-miyakejima
    layout: { x: 300, y: 200 }
    color: "#81B29A"
    postmaster: { name: あかつき局長, tone: elder, provenance: creative }
  - ref: tokyo-mikurajima
    layout: { x: 400, y: 250 }
    color: "#F2CC8F"
    postmaster: { name: いさりび局長, tone: casual, provenance: creative }
  - ref: tokyo-hachijojima
    layout: { x: 560, y: 340 }
    color: "#9C6ADE"
    postmaster:               # 名前は計画書の記述にちなむ（ゲームデザイン §7.3）
      name: フルーツレモン局長
      tone: casual
      provenance: derived
      source: { dataset: mlit-ritou-2026, region: 伊豆諸島地域, field: LOCAL_INDUSTRY_TOURISM, quote: "八丈フルーツレモン" }
  - ref: tokyo-aogashima
    layout: { x: 680, y: 400 }
    color: "#5FB3B3"
    postmaster: { name: ほしぞら局長, tone: elder, provenance: creative }

routes:                         # 6 島のすべての組（15 本）。航路の形＝Raft のネットワーク（ゲームデザイン §3.5）
                                # travelMs = 65 + 1.1 × 配置（layout）の距離、10 ms 単位（demo-izu と同じ。データ仕様 §4.5）
  - { a: tokyo-oshima, b: tokyo-toshima, travelMs: 220, provenance: creative }
  - { a: tokyo-oshima, b: tokyo-miyakejima, travelMs: 260, provenance: creative }
  - { a: tokyo-oshima, b: tokyo-mikurajima, travelMs: 380, provenance: creative }
  - { a: tokyo-oshima, b: tokyo-hachijojima, travelMs: 580, provenance: creative }
  - { a: tokyo-oshima, b: tokyo-aogashima, travelMs: 730, provenance: creative }
  - { a: tokyo-toshima, b: tokyo-miyakejima, travelMs: 210, provenance: creative }
  - { a: tokyo-toshima, b: tokyo-mikurajima, travelMs: 290, provenance: creative }
  - { a: tokyo-toshima, b: tokyo-hachijojima, travelMs: 480, provenance: creative }
  - { a: tokyo-toshima, b: tokyo-aogashima, travelMs: 620, provenance: creative }
  - { a: tokyo-miyakejima, b: tokyo-mikurajima, travelMs: 190, provenance: creative }
  - { a: tokyo-miyakejima, b: tokyo-hachijojima, travelMs: 390, provenance: creative }
  - { a: tokyo-miyakejima, b: tokyo-aogashima, travelMs: 540, provenance: creative }
  - { a: tokyo-mikurajima, b: tokyo-hachijojima, travelMs: 270, provenance: creative }
  - { a: tokyo-mikurajima, b: tokyo-aogashima, travelMs: 410, provenance: creative }
  - { a: tokyo-hachijojima, b: tokyo-aogashima, travelMs: 210, provenance: creative }

ferries:                        # 船名は計画書の PORTS の記述（fact。6 隻すべて）。積載量・速度・母港はゲーム上の設定（§5.5）。各島に 1 隻（T-718）
  - { id: f1, name: 橘丸, home: tokyo-oshima, capacity: 4, speed: 1.0, provenance: fact }
  - { id: f2, name: くろしお丸, home: tokyo-miyakejima, capacity: 3, speed: 1.0, provenance: fact }
  - { id: f3, name: あおがしま丸, home: tokyo-hachijojima, capacity: 3, speed: 1.0, provenance: fact }
  - { id: f4, name: フェリーあぜりあ, home: tokyo-mikurajima, capacity: 3, speed: 1.0, provenance: fact }
  - { id: f5, name: 新さるびあ丸, home: tokyo-toshima, capacity: 3, speed: 1.0, provenance: fact }
  - { id: f6, name: セブンアイランド結, home: tokyo-aogashima, capacity: 3, speed: 1.0, provenance: fact }

raft:
  initialLeader: tokyo-oshima
  tickMs: 500
  heartbeatTick: 2
  electionTick: 50              # 25〜50 秒（進行表 §1。T-718 で 40 から 50 に）
  checkQuorum: true
  preVote: true
  maxInflightMsgs: 4
  maxSizePerMsg: 4096

transport: { dockMs: 1500, perLinkAppCap: 4, portCap: 24, relayCap: 12 }

resources:
  - { id: "firework:a", kind: firework, label: 大花火 A, critical: true }
  - { id: "firework:b", kind: firework, label: 大花火 B, critical: true }
  - { id: "stall:main", kind: stall, label: 屋台の出店枠, capacity: 3 }

requests:
  deadlineMs: { normal: 60000, critical: 90000 }
  retryMs: 25000
  script:                       # 進行表 §5 の時刻の表から
    - { at: 10000,  island: tokyo-toshima,     kind: stall.reserve,    resource: "stall:main" }
    - { at: 20000,  island: tokyo-oshima,      kind: firework.reserve, resource: "firework:a" }
    - { at: 35000,  island: tokyo-miyakejima,  kind: stall.reserve,    resource: "stall:main" }
    - { at: 50000,  island: tokyo-hachijojima, kind: firework.reserve, resource: "firework:a" }
    - { at: 125000, island: tokyo-hachijojima, kind: firework.reserve, resource: "firework:b" }
    - { at: 140000, island: tokyo-mikurajima,  kind: stall.reserve,    resource: "stall:main" }
    - { at: 160000, island: tokyo-oshima,      kind: stall.reserve,    resource: "stall:main" }
    - { at: 180000, island: tokyo-aogashima,   kind: stall.reserve,    resource: "stall:main" }
  random:
    rateMilliPerMin: 500        # 毎分 0.5 件（人口の 0.5 乗の重み。大島・八丈島に多い）
    slotMs: 10000
    populationExponent: 0.5
    kinds: [ { kind: stall.reserve, resource: "stall:main", weight: 1 } ]

events:
  - kind: storm                 # 北（大島・利島）と南（三宅島・御蔵島・八丈島・青ヶ島）に分ける（進行表 §5）。北と南を結ぶ 8 本を止める
    at: 70000
    durationMs: 50000
    routes: [[tokyo-oshima, tokyo-miyakejima], [tokyo-oshima, tokyo-mikurajima], [tokyo-oshima, tokyo-hachijojima], [tokyo-oshima, tokyo-aogashima], [tokyo-toshima, tokyo-miyakejima], [tokyo-toshima, tokyo-mikurajima], [tokyo-toshima, tokyo-hachijojima], [tokyo-toshima, tokyo-aogashima]]
    forecastMs: 10000
    flavor:
      text: 台風が近づき、大島・利島と南の島々の間の海が荒れています
      provenance: derived
      source: { dataset: mlit-ritou-2026, region: 伊豆諸島地域, field: DISASTER_LAND_CONSERVATION, quote: "平成25年台風26号による大島町の被害" }
  - kind: cancellation          # 欠航率から決める欠航（データ仕様 §4.4）。欠航率 17% × 10
    island: tokyo-toshima
    probabilityPermille: 170
    slotMs: 30000
    durationMs: 10000
    provenance: derived
    source: { dataset: mlit-ritou-2026, region: 伊豆諸島地域, field: MARITIME_TRANSPORT, quote: "令和2(2020)年利島17%、御蔵島・青ヶ島41%" }
  - kind: cancellation          # 欠航率 41% × 10
    island: tokyo-mikurajima
    probabilityPermille: 410
    slotMs: 30000
    durationMs: 10000
    provenance: derived
    source: { dataset: mlit-ritou-2026, region: 伊豆諸島地域, field: MARITIME_TRANSPORT, quote: "令和2(2020)年利島17%、御蔵島・青ヶ島41%" }
  - kind: cancellation          # 欠航率 41% × 10
    island: tokyo-aogashima
    probabilityPermille: 410
    slotMs: 30000
    durationMs: 10000
    provenance: derived
    source: { dataset: mlit-ritou-2026, region: 伊豆諸島地域, field: MARITIME_TRANSPORT, quote: "令和2(2020)年利島17%、御蔵島・青ヶ島41%" }

scoring:
  target: { successes: 3, score3: 480 }   # 目標は novice・greedy で決める（T-718。進行表 §1）
  points: { normal: 100, critical: 300, late: 30, rejected: 0, expiredPenalty: 50 }
  ferryCostMsPerPoint: 2000
  fairnessPerSatisfaction: 5

satisfaction:
  initial: 60
  silenceAfterMs: 30000
  silencePenalty: { everyMs: 10000, amount: 2 }
  succeeded: 10
  rejectedPenalty: 3
  expiredPenalty: 10

speed:
  allowed: [0.5, 1, 2, 4]
