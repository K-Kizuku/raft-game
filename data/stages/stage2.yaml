# Stage 2「島から返事が来ない！」（五島列島）。値は進行表 §4・データ仕様 §5.3 のとおり（調整は T-501）。
format: 1
id: stage2
title: 島から返事が来ない！
region: 五島列島（長崎県）
intro:
  text: 世界遺産の潜伏キリシタン関連遺産が残る五島列島。福江島・奈留島・中通島を、2 隻の郵便船で結びます。
  provenance: derived
  source: { dataset: mlit-ritou-2026, region: 離島振興対策実施地域, field: LOCAL_INDUSTRY_TOURISM, quote: "世界遺産登録された「長崎と天草地方の潜伏キリシタン関連遺産」" }
learning: [heartbeat, election_timeout, leader_election, check_quorum, state_machine_replication]
durationMs: 210000
unlock: stage1

islands:
  - { ref: nagasaki-fukue, layout: { x: 200, y: 320 }, color: "#E07A5F" }
  - { ref: nagasaki-naru, layout: { x: 420, y: 230 }, color: "#3D85C6" }
  - { ref: nagasaki-nakadori, layout: { x: 640, y: 120 }, color: "#81B29A" }

routes:                         # ゲーム上の設定（進行表 §4）
  - { a: nagasaki-fukue, b: nagasaki-naru, travelMs: 4000, provenance: creative }
  - { a: nagasaki-naru, b: nagasaki-nakadori, travelMs: 6000, provenance: creative }
  - { a: nagasaki-fukue, b: nagasaki-nakadori, travelMs: 9000, provenance: creative }

ferries:
  - { id: f1, name: ごとう丸, home: nagasaki-fukue, capacity: 4, speed: 1.0 }
  - { id: f2, name: しまかぜ, home: nagasaki-naru, capacity: 3, speed: 0.8 }

raft:
  initialLeader: nagasaki-fukue
  tickMs: 500
  heartbeatTick: 2
  electionTick: 40              # 20〜40 秒
  checkQuorum: true
  preVote: true
  maxInflightMsgs: 4
  maxSizePerMsg: 4096

transport: { dockMs: 1500, perLinkAppCap: 4, portCap: 24, relayCap: 12 }

resources:
  - { id: "firework:a", kind: firework, label: 大花火 A, critical: true }
  - { id: "firework:b", kind: firework, label: 大花火 B, critical: true }
  - { id: "stall:main", kind: stall, label: 屋台の出店枠, capacity: 3 }

requests:
  deadlineMs: { normal: 60000, critical: 90000 }
  retryMs: 25000
  script:                       # 進行表 §4 の表と「依頼の台本」
    - { at: 10000,  island: nagasaki-nakadori, kind: stall.reserve,    resource: "stall:main" }
    - { at: 20000,  island: nagasaki-fukue,    kind: firework.reserve, resource: "firework:a" }
    - { at: 35000,  island: nagasaki-naru,     kind: stall.reserve,    resource: "stall:main" }
    - { at: 45000,  island: nagasaki-nakadori, kind: firework.reserve, resource: "firework:a" }
    - { at: 110000, island: nagasaki-naru,     kind: firework.reserve, resource: "firework:b" }
    - { at: 120000, island: nagasaki-nakadori, kind: stall.reserve,    resource: "stall:main" }
    - { at: 140000, island: nagasaki-fukue,    kind: stall.reserve,    resource: "stall:main" }
    - { at: 160000, island: nagasaki-naru,     kind: stall.reserve,    resource: "stall:main" }
    - { at: 180000, island: nagasaki-nakadori, kind: stall.reserve,    resource: "stall:main" }
  random:
    rateMilliPerMin: 500        # 毎分 0.5 件（人口の 0.5 乗の重み。福江島 511‰・中通島 363‰・奈留島 126‰）
    slotMs: 10000
    populationExponent: 0.5
    kinds: [ { kind: stall.reserve, resource: "stall:main", weight: 1 } ]

events:
  - kind: storm                 # 福江島を孤立させる（データ仕様 §5.3）
    at: 60000
    durationMs: 40000
    routes: [[nagasaki-fukue, nagasaki-naru], [nagasaki-fukue, nagasaki-nakadori]]
    forecastMs: 10000
    flavor:
      text: 台風が近づき、福江島のまわりの海が荒れています
      provenance: derived
      source: { dataset: mlit-ritou-2026, region: 離島振興対策実施地域, field: NATURAL_CLIMATE_FEATURES, quote: "台風等の自然災害の影響を受けやすい" }

scoring:
  target: { successes: 5, score3: 1400 }
  points: { normal: 100, critical: 300, late: 30, rejected: 0, expiredPenalty: 50 }
  ferryCostMsPerPoint: 2000
  fairnessPerSatisfaction: 5

satisfaction:
  initial: 60
  silenceAfterMs: 30000
  silencePenalty: { everyMs: 10000, amount: 2 }
  succeeded: 10
  rejectedPenalty: 3
  expiredPenalty: 10

speed:
  allowed: [0.5, 1, 2, 4]
