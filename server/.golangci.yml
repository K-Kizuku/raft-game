# golangci-lint v2 の設定（T-005 / #13）。
# 版は ci.yml の server ジョブと Makefile の GOLANGCI_LINT_VERSION（v2.15.0）に固定し、
# `go -C server run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@<版> run ./...` で実行する。
# パスはこのファイル（server/）からの相対パス（run.relative-path-mode の既定は cfg）。
# テストのファイルも対象（run.tests の既定は true）。
version: "2"

linters:
  default: standard # errcheck・govet・ineffassign・staticcheck・unused
  enable:
    - forbidigo
  settings:
    staticcheck:
      # 既定の checks から QF1008 を外す。CLAUDE.md の「etcd-io/raft v3.7 の注意点」で
      # `st.HardState.GetTerm()` と書くよう決めているが、QF1008 は埋め込みのフィールドを
      # 省くよう指摘する（#18 の example_test.go で 3 件出る）。
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1008"]
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.(Now|Since|Until|Sleep|After|AfterFunc|Tick|NewTimer|NewTicker)$'
          pkg: '^time$'
          msg: 実時間は使わない。時刻は SimTime だけで表す（DesignDoc §9.2）
        - pattern: '^rand\.'
          pkg: '^math/rand$'
          msg: math/rand（v1）は使わない。乱数は sim.Sub で作る（§9.1）
        - pattern: '^rand\.(Int|IntN|Int32|Int32N|Int64|Int64N|Uint|UintN|Uint32|Uint32N|Uint64|Uint64N|N|Float32|Float64|ExpFloat64|NormFloat64|Perm|Shuffle)$'
          pkg: '^math/rand/v2$'
          msg: パッケージ全体で共有される乱数は使わない。rand.New(rand.NewPCG(…)) か sim.Sub を使う（§9.1）
        - pattern: '^float(32|64)$'
          msg: 浮動小数点を使わない。整数（千分率など）で計算する（§9.2）
  exclusions:
    rules:
      # forbidigo は、sim.Engine の中で動くパッケージと、ボット（入力ログを通して結果に効く）と、DTN の決定的なパッケージ（islandcore・coordcore #363・dtn/bpv7 #163・dtn/ferryactor #161）だけに効かせる。
      # 範囲を狭めるときは path-except の正規表現だけを変える（DesignDoc §9.2）。
      - path-except: '^internal/(sim|islandcore|coordcore|cluster|ferry|ledger|game|bot|replaykit|dtn/bpv7|dtn/ferryactor)/'
        linters:
          - forbidigo
